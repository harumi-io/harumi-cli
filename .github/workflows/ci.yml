name: CI

# Runs the offline test suite (pytest + import/compile check) on every push to
# main/dev and every pull request. This is the required status check that gates
# merges into main (see the repo's branch protection).
on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src

      - name: Test
        run: pytest -q
