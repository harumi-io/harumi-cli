name: Release bump

# Makes "merge the promotion" the only step of a release.
#
# Write the notes for the next release under an undated `## X.Y.Z` heading at the top of src/harumi/changelog.md while
# you work. When "Promote dev to main" is opened, this runs scripts/release_bump.py, which sets `__version__`, dates
# the heading and regenerates cli-surface.json, commits that to `dev`, and starts CI on the new commit. The promotion PR
# then carries the bump, and release.yml publishes when it is merged (it releases whenever `__version__` changes on main).
#
# It comments the outcome on the PR either way, including "nothing to bump" and "this PR will not publish anything".
# A hotfix merged straight to `main` is not a promotion: bump `__version__` by hand there, as 0.11.1 was.
#
# Pushes made with the default GITHUB_TOKEN do not start other workflows, which is why CI is dispatched explicitly (ci.yml
# has `workflow_dispatch`). `dev` is not a protected branch, which is what lets the push work; if that changes this
# needs a token that may push to it.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Opening, closing and reopening the PR in a row must not make two bump commits.
  group: release-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Bump the version on dev
    # Only the promotion: dev into main, within this repository. A fork's PR, or a hotfix branch into main, is not a
    # release being prepared. Nothing from the PR (title, body, branch text) is used below, only the repository and number.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the bump to dev
      actions: write # start CI on that commit
      pull-requests: write # comment the result on the promotion PR
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0 # the tag check below needs the tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The surface is generated by importing the CLI, so it needs its dependencies.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Work out the bump
        id: bump
        run: |
          set +e
          python scripts/release_bump.py > bump.out 2> bump.err
          code=$?
          set -e
          cat bump.out >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat bump.err >&2

      - name: Commit the bump to dev
        id: commit
        if: steps.bump.outputs.code == '0' && steps.bump.outputs.action != 'noop'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/harumi/__init__.py src/harumi/changelog.md cli-surface.json
          git commit -m "chore(release): $VERSION"
          git push origin HEAD:dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A push with GITHUB_TOKEN starts no workflows, and the promotion needs `test` on its new head commit.
      - name: Start CI on that commit
        if: steps.commit.outputs.sha != ''
        run: gh workflow run ci.yml --ref dev

      - name: Is this version already released?
        id: tag
        if: steps.bump.outputs.code == '0'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell the promotion PR
        if: always() && steps.bump.outcome != 'skipped'
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.bump.outputs.code }}
          ACTION: ${{ steps.bump.outputs.action }}
          VERSION: ${{ steps.bump.outputs.version }}
          DATE: ${{ steps.bump.outputs.date }}
          SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          TAGGED: ${{ steps.tag.outputs.exists }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr="$EVENT_PR"
          if [ -z "$pr" ]; then
            pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f head="${REPO%%/*}:dev" --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then echo "No open promotion PR to comment on."; exit 0; fi

          {
            if [ "$CODE" != "0" ]; then
              echo "**Release bump could not run.** Nothing was committed."
              echo
              echo '```'
              tail -n 5 bump.err
              echo '```'
              echo
              echo "Fix it on \`dev\`, then close and reopen this PR, or run the _Release bump_ workflow by hand. ([run]($RUN_URL))"
            elif [ "$COMMIT_OUTCOME" = "failure" ]; then
              echo "**Release bump worked out $VERSION but could not push it to \`dev\`** (it may have moved, or be protected now). Nothing was released. ([run]($RUN_URL))"
            elif [ "$ACTION" = "noop" ]; then
              echo "**Nothing to bump.** The newest changelog entry, $VERSION, is already dated and matches \`__version__\`."
              if [ "$TAGGED" = "true" ]; then
                echo
                echo "**\`v$VERSION\` is already released, so merging this will publish nothing.** If this promotion is meant to release something, add its notes under a new undated \`## X.Y.Z\` heading on \`dev\`, then reopen this PR."
              fi
            else
              echo "**Release bump: $VERSION ($DATE).** Committed to \`dev\` as \`${SHA:0:7}\` (\`__version__\`, the changelog date and \`cli-surface.json\`), and CI was started on it. This PR's head moves to that commit; wait for \`test\` to pass on it before merging."
              echo
              echo "Merging this PR with a **merge commit** tags \`v$VERSION\` and publishes it to PyPI. A version can never be reused."
              if [ "$TAGGED" = "true" ]; then
                echo
                echo "**Warning:** \`v$VERSION\` already exists as a tag, so merging this will not publish. Check the heading."
              fi
            fi
          } > comment.md
          gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@comment.md >/dev/null
          echo "Commented on #$pr."
