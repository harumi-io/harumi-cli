name: Close completed parent

# GitHub does not close a parent issue when its sub-issues are done, and the board only moves a
# card to Done when the issue closes. When the last open sub-issue of a parent closes, this closes
# the parent as completed (and its parent in turn); the board's "Item closed" workflow then moves
# the card to Done.
#
# This repo is public, so it cannot call the shared workflow in the private harumi-io/.github-private
# (GitHub forbids it). This is a copy of .github/workflows/close-completed-parent.yml there, with
# the PAT read from secrets.ORG_PROJECT_PAT. Keep both in sync.
#
# Closed counts as done whatever the reason, so a piece closed as "not planned" does not block its
# parent. A parent that is already closed, or that still has an open sub-issue, is left alone.
#
# Runs for the same parent are serialized. Siblings can close within seconds of each other, and
# closing a parent with the PAT fires a new `closed` run for that parent, so parallel runs could
# read the same state and comment twice. A first job reads the closed issue's parent, and the
# second runs under a concurrency group named after it, one at a time. GitHub keeps one pending run
# per group and replaces an older pending run with a newer one. That is safe here because every
# run reads the live state and only ever concerns that one parent: the last run in the queue starts
# after every close that queued before it, so it sees them all. (A group per tree, or a global one,
# would let a replaced run belong to a different branch of the tree, and that parent would never
# be checked.) Groups are scoped to the repository that runs the workflow, and the walk up to the
# grandparent is not serialized, so two parents finishing at the same moment can still comment
# twice on theirs: harmless, as the close itself is idempotent.
on:
  issues:
    types: [closed]

jobs:
  # Read-only: names the closed issue's parent, empty when it has none.
  find-parent:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      parent: ${{ steps.read.outputs.parent }}
    steps:
      - name: Read the parent
        id: read
        env:
          GH_TOKEN: ${{ secrets.ORG_PROJECT_PAT }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          parent=""
          # 404 means "no parent": the normal end. Anything else is a real error.
          if out=$(gh api "repos/$REPO/issues/$ISSUE/parent" 2>&1); then
            parent=$(jq -r '(.repository_url | sub(".*/repos/"; "")) + "#" + (.number | tostring)' <<<"$out")
          elif ! grep -q "HTTP 404" <<<"$out"; then
            echo "::error::Could not read the parent of $REPO#$ISSUE: $out"
            exit 1
          fi

          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          echo "Parent: ${parent:-none}"

  close-parent:
    needs: find-parent
    if: ${{ needs.find-parent.outputs.parent != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: close-completed-parent-${{ needs.find-parent.outputs.parent }}
      cancel-in-progress: false
    # Never touches GITHUB_TOKEN: every API call uses secrets.ORG_PROJECT_PAT.
    permissions: {}
    steps:
      - name: Close each ancestor whose sub-issues are all closed
        env:
          GH_TOKEN: ${{ secrets.ORG_PROJECT_PAT }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          repo="$REPO"
          num="$ISSUE"
          trigger="$REPO#$ISSUE"

          # The depth cap is a guard against a cycle, not a real limit.
          for _ in 1 2 3 4 5 6 7 8; do
            # 404 means "no parent": the normal end of the walk. Anything else is a real error.
            if ! out=$(gh api "repos/$repo/issues/$num/parent" 2>&1); then
              if grep -q "HTTP 404" <<<"$out"; then
                echo "$repo#$num has no parent."
                exit 0
              fi
              echo "::error::Could not read the parent of $repo#$num: $out"
              exit 1
            fi

            parent_repo=$(jq -r '.repository_url | sub(".*/repos/"; "")' <<<"$out")
            parent_num=$(jq -r '.number' <<<"$out")
            parent_state=$(jq -r '.state' <<<"$out")
            total=$(jq -r '.sub_issues_summary.total' <<<"$out")
            completed=$(jq -r '.sub_issues_summary.completed' <<<"$out")

            # A missing summary makes jq print "null" for both, and null == null would close the
            # parent. Closing is hard to undo, so anything but two real counts leaves it open.
            if ! [[ "$total" =~ ^[0-9]+$ && "$completed" =~ ^[0-9]+$ ]] || [ "$total" -eq 0 ]; then
              echo "::warning::No usable sub_issues_summary for $parent_repo#$parent_num; leaving it open."
              exit 0
            fi

            if [ "$parent_state" != "open" ]; then
              echo "$parent_repo#$parent_num is already $parent_state; nothing to do."
              exit 0
            fi
            if [ "$completed" != "$total" ]; then
              echo "$parent_repo#$parent_num has $completed of $total sub-issues closed; leaving it open."
              exit 0
            fi

            # Close first: a failed close must not leave a comment that repeats on every retry. A
            # failed comment, on the other hand, is not worth stopping the walk for.
            gh api -X PATCH "repos/$parent_repo/issues/$parent_num" \
              -f state=closed -f state_reason=completed >/dev/null
            echo "Closed $parent_repo#$parent_num ($completed of $total sub-issues closed)."
            gh api -X POST "repos/$parent_repo/issues/$parent_num/comments" \
              -f body="All $total sub-issues are closed (last one: $trigger). Closed this parent as completed." \
              >/dev/null \
              || echo "::warning::Closed $parent_repo#$parent_num but could not comment on it."

            repo="$parent_repo"
            num="$parent_num"
          done
