[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harumi"
dynamic = ["version"]
description = "Run local optimization code on Harumi's infrastructure from your own machine or IDE."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Harumi" }]
keywords = ["harumi", "optimization", "solver", "gurobi", "or-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://harumi.io"
Documentation = "https://docs.harumi.io/docs/cli"
Repository = "https://github.com/harumi-io/harumi-cli"
Issues = "https://github.com/harumi-io/harumi-cli/issues"

[project.scripts]
harumi = "harumi.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.version]
path = "src/harumi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harumi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
