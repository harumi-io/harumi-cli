[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harumi"
dynamic = ["version"]
description = "Run local optimization code on Harumi's infrastructure from your own machine or IDE."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Harumi" }]
keywords = ["harumi", "optimization", "solver", "gurobi", "or-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    # 0.16 is the floor, not 0.12. Typer <0.16 declares an unbounded
    # `click>=8.0.0`, so a fresh install pairs it with modern click (>=8.2) and
    # the CLI dies at startup — every command, `harumi --version` included:
    #   * <0.13 rejects boolean-pair flags (`--bind/--no-bind`) with
    #     "Secondary flag is not valid for non-boolean flag".
    #   * 0.13-0.15.3 then break on `--help` because click's
    #     Parameter.make_metavar() gained a required `ctx` argument.
    # (0.15.4 happens to work only because it pins click<8.2 — too fragile to
    # rely on.) 0.16+ is compatible with current click, and still supports the
    # Python 3.9 floor above. Guarded by
    # tests/test_cli.py::test_every_command_builds.
    "typer>=0.16",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://harumi.io"
Documentation = "https://docs.harumi.io/docs/cli"
Repository = "https://github.com/harumi-io/harumi-cli"
Issues = "https://github.com/harumi-io/harumi-cli/issues"

[project.scripts]
harumi = "harumi.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.version]
path = "src/harumi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harumi"]

[tool.hatch.build.targets.wheel.force-include]
# Bundles the canonical skill docs (source of truth: .agents/skills/) into the
# wheel so `harumi skill install` can seed them onto a machine without a repo
# clone. See src/harumi/skills.py.
".agents/skills" = "harumi/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
