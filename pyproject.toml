[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harumi"
version = "0.1.0"
description = "Run local optimization code on Harumi's infrastructure from your own machine or IDE."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Harumi" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.scripts]
harumi = "harumi.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harumi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
